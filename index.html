      <h1>Cong Li (李聪)</h1>
      <p>Postdoctoral Researcher at Advanced Software Technologies (AST) Lab, ETH Zurich, working with Prof. Zhendong Su.</p>
      <p>Ph.D. from Nanjing University, advised by Prof. Yanyan Jiang and Prof. Chang Xu</a>.</p>
      <p><strong>Research interests:</strong> compilers (LLVM/GCC), language VMs (HotSpot, OpenJ9, Graal, ART, V8, JSC), Android systems, LLM agents for compiler optimization and fuzzing.</p>

      <h2>Selected Publications</h2>
      <ul>
        <li><strong>[PLDI'26]</strong> Kavya Chopra*, Cong Li*, Thodoris Sotiropoulos, Zhendong Su. <em>Semantic Reification: A New Paradigm for Random Program Generation.</em> (* Equal contribution)</li>
        <li><strong>[arXiv'26]</strong> Yingwei Zheng*, Cong Li*, Shaohua Li, Yuqun Zhang, Zhendong Su. <em>Agentic Harness for Real-World Compilers.</em> (* Equal contribution)</li>
        <li><strong>[TOCS'25]</strong> Cong Li, Yanyan Jiang, Chang Xu, Zhendong Su. <em>Validating JIT Compilers via Compilation Space Exploration.</em></li>
        <li><strong>[ASE'24]</strong> Cong Li, Zhaogui Xu, Peng Di, Dongxia Wang, Zheng Li, Qian Zheng. <em>Understanding Code Changes Practically with Small-Scale Language Models.</em></li>
        <li><strong>[ASPLOS'24]</strong> Xianfei Ou, Cong Li, Yanyan Jiang, Chang Xu. <em>The Mutators Reloaded: Fuzzing Compilers with Large Language Model Generated Mutation Operators.</em></li>
        <li><strong>[SOSP'23, Best Paper Award]</strong> Cong Li, Yanyan Jiang, Chang Xu, Zhendong Su. <em>Validating JIT Compilers via Compilation Space Exploration.</em></li>
        <li><strong>[ESEC/FSE'22]</strong> Cong Li, Yanyan Jiang, Chang Xu. <em>Cross-Device Record and Replay for Android Apps.</em></li>
        <li><strong>[ICSE'22]</strong> Cong Li, Yanyan Jiang, Chang Xu. <em>Push-Button Synthesis of Watch Companions for Android Apps.</em></li>
      </ul>

      <h2>Open-Source Tools</h2>
      <ul>
        <li><strong>Artemis</strong> — JIT compiler validation via compilation space exploration. <a href="https://github.com/test-jitcomp/Artemis">github.com/test-jitcomp/Artemis</a></li>
        <li><strong>Reify</strong> — Semantic reification for random program generation. <a href="https://github.com/connglli/Reify">github.com/connglli/Reify</a></li>
        <li><strong>llvm-harness</strong> — Agentic harness for real-world compilers. <a href="https://github.com/connglli/llvm-harness">github.com/connglli/llvm-harness</a></li>
        <li><strong>MetaMut</strong> — LLM-generated mutation operators for compiler fuzzing. <a href="https://github.com/icsnju/MetaMut">github.com/icsnju/MetaMut</a></li>
        <li><strong>RefractIR</strong> — Symbolic language for program generation. <a href="https://github.com/connglli/RefractIR">github.com/connglli/RefractIR</a></li>
